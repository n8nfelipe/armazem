name: CI, build e release SemVer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testar e construir
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do backend
        run: python -m pip install -r backend/requirements.txt

      - name: Testar backend
        working-directory: backend
        run: python -m unittest discover -v

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Build do frontend
        working-directory: frontend
        run: npm run build

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: armazem-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build da imagem web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: armazem-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Gerar tag SemVer
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout com histórico e tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calcular e publicar versão
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "${latest_tag}" ]]; then
            base_major=0
            base_minor=0
            base_patch=0
            commit_range="$(git rev-list --max-parents=0 HEAD)..HEAD"
          else
            version="${latest_tag#v}"
            IFS=. read -r base_major base_minor base_patch <<< "${version}"
            commit_range="${latest_tag}..HEAD"
          fi

          commit_count="$(git rev-list --count "${commit_range}" 2>/dev/null || echo 0)"
          if [[ -z "${commit_range}" ]] || [[ "${commit_count}" -eq 0 ]]; then
            echo "Não há commits para versionar."
            exit 0
          fi

          bump=patch
          while IFS= read -r commit; do
            if git log -1 --format=%B "${commit}" | grep -Eq 'BREAKING CHANGE|BREAKING-CHANGE'; then
              bump=major
              break
            elif git log -1 --format=%s "${commit}" | grep -Eq '^[a-zA-Z]+(\([^)]*\))?!:'; then
              bump=major
              break
            elif git log -1 --format=%s "${commit}" | grep -Eq '^feat(\([^)]*\))?:'; then
              bump=minor
            fi
          done < <(git rev-list "${commit_range}")

          case "${bump}" in
            major)
              next_major=$((base_major + 1))
              next_minor=0
              next_patch=0
              ;;
            minor)
              next_major=${base_major}
              next_minor=$((base_minor + 1))
              next_patch=0
              ;;
            *)
              next_major=${base_major}
              next_minor=${base_minor}
              next_patch=$((base_patch + 1))
              ;;
          esac

          next_tag="v${next_major}.${next_minor}.${next_patch}"
          if git rev-parse "${next_tag}" >/dev/null 2>&1; then
            echo "A tag ${next_tag} já existe; nada a publicar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${next_tag}" -m "release: ${next_tag}" "${GITHUB_SHA}"
          git push origin "${next_tag}"
          echo "Tag ${next_tag} publicada (${bump})."
