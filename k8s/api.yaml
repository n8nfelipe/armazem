apiVersion: v1
kind: Service
metadata:
  name: armazem-api
  namespace: armazem
  labels:
    app.kubernetes.io/name: armazem-api
    app.kubernetes.io/part-of: armazem
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: armazem-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: armazem-api
  namespace: armazem
  labels:
    app.kubernetes.io/name: armazem-api
    app.kubernetes.io/part-of: armazem
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: armazem-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armazem-api
        app.kubernetes.io/part-of: armazem
    spec:
      # Pods não precisam falar com a API do Kubernetes.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: armazem-api:local
          imagePullPolicy: IfNotPresent
          # Sem shell: evita expor senha em /proc e mantém o
          # comportamento do Dockerfile sem o --reload de dev.
          command: ["uvicorn"]
          args: ["main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armazem-secrets
                  key: POSTGRES_PASSWORD
            # Expansão do Kubernetes: $(POSTGRES_PASSWORD) resolve
            # em tempo de criação do container, sem shell.
            # FQDN evita depender do search-domain do namespace.
            - name: DATABASE_URL
              value: "postgresql+psycopg://estoque:$(POSTGRES_PASSWORD)@postgres.armazem.svc.cluster.local:5432/estoque"
            - name: ADMIN_USERNAME
              value: admin
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: armazem-secrets
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: armazem-secrets
                  key: JWT_SECRET
            - name: FRONTEND_ORIGINS
              value: http://armazem.local,http://armazem.local:30558,http://armazem.localhost:18080,http://localhost:3000
            - name: AGENT_PROVIDER
              value: local
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: armazem-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_MODEL
              value: gpt-5.6-luna
            - name: OPENAI_BASE_URL
              value: https://api.openai.com/v1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # Habilite runAsNonRoot quando a imagem tiver USER
            # não-root (ex.: Dockerfile com `USER appuser`).
            # runAsNonRoot: true
            # runAsUser: 65532
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
