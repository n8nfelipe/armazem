apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: armazem-web
  namespace: armazem
spec:
  ingressClassName: nginx
  rules:
    - host: armazem.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: armazem-web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: armazem-api
  namespace: armazem
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: armazem.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: armazem-api
                port:
                  name: http
