apiVersion: v1
kind: Service
metadata:
  name: armazem-web
  namespace: armazem
spec:
  selector:
    app.kubernetes.io/name: armazem-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: armazem-web
  namespace: armazem
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: armazem-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: armazem-web
    spec:
      containers:
        - name: web
          image: armazem-web:local
          imagePullPolicy: IfNotPresent
          env:
            # Usa a mesma origem do Ingress, incluindo a porta quando houver NodePort.
            - name: NEXT_PUBLIC_API_URL
              value: /api
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
